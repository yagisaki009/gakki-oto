<!DOCTYPE html>
<html lang="ja" manifest="offline.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="がっきおと">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#fff3d6">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>がっき おとボタン</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#fff3d6;}
*{-webkit-box-sizing:border-box;box-sizing:border-box;}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;color:#4a2c12;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0);
  -webkit-text-size-adjust:100%;touch-action:none;}

#bar{position:fixed;height:46px;}
#title{position:absolute;left:4px;top:0;line-height:46px;font-size:18px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#pills{position:absolute;right:0;top:6px;white-space:nowrap;}
.pill{position:relative;display:inline-block;vertical-align:top;margin-left:8px;height:34px;line-height:34px;padding:0 13px;
  border-radius:17px;background:#fff;box-shadow:0 2px 0 rgba(74,44,18,.15);font-size:14px;font-weight:bold;overflow:hidden;}
.pill .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffc078;}
.pill.holding .fill{width:100%;-webkit-transition:width .9s linear;transition:width .9s linear;}
.pill span{position:relative;}
.pill .hint{font-size:10px;font-weight:normal;opacity:.55;margin-left:5px;}
#stop.off{opacity:.35;}
@media (max-width:600px){.pill .hint{display:none}.pill{padding:0 10px;margin-left:6px}#title{font-size:15px}}

#grid{position:fixed;left:0;top:0;right:0;bottom:0;}
.tile{position:absolute;border-radius:20px;
  background-image:-webkit-linear-gradient(top,rgba(255,255,255,.38),rgba(255,255,255,0) 55%);
  background-image:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,0) 55%);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 4px 0 rgba(74,44,18,.13);
  -webkit-transition:-webkit-transform .18s ease-out,box-shadow .18s;transition:transform .18s ease-out,box-shadow .18s;}
.tile.down{-webkit-transform:scale(.97) translateY(2px);transform:scale(.97) translateY(2px);}
.tile:after{content:"";position:absolute;left:-5px;top:-5px;right:-5px;bottom:-5px;border-radius:inherit;border:4px solid #fff;opacity:0;}
.tile.playing:after{-webkit-animation:glow 1.4s ease-in-out infinite alternate;animation:glow 1.4s ease-in-out infinite alternate;}
.art{position:absolute;display:block;-webkit-user-drag:none;pointer-events:none;}
/* 再生中はゆっくり、小さくゆれる */
.tile.playing .art{-webkit-animation:sway 1.8s ease-in-out infinite alternate;animation:sway 1.8s ease-in-out infinite alternate;}
.lab{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;line-height:1.3;pointer-events:none;}
.lab span{display:inline-block;background:rgba(255,255,255,.92);border-radius:999px;padding:.08em .6em;font-weight:bold;color:#3a2410;}
@-webkit-keyframes glow{from{opacity:.25}to{opacity:.9}}
@keyframes glow{from{opacity:.25}to{opacity:.9}}
@-webkit-keyframes sway{from{-webkit-transform:rotate(-3deg) translateY(0)}to{-webkit-transform:rotate(3deg) translateY(-3px)}}
@keyframes sway{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(3deg) translateY(-3px)}}

/* 音符 */
#fx{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;overflow:hidden;}
.note{position:absolute;width:30px;margin-left:-15px;text-align:center;font-weight:bold;line-height:1;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 2px 0 #fff;}
.n1{-webkit-animation:up1 1.9s ease-out forwards;animation:up1 1.9s ease-out forwards;}
.n2{-webkit-animation:up2 1.9s ease-out forwards;animation:up2 1.9s ease-out forwards;}
@-webkit-keyframes up1{0%{-webkit-transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}100%{-webkit-transform:translate(-26px,-110px) scale(1.15);opacity:0}}
@keyframes up1{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(-26px,-110px) scale(1.15);opacity:0}}
@-webkit-keyframes up2{0%{-webkit-transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}100%{-webkit-transform:translate(26px,-110px) scale(1.15);opacity:0}}
@keyframes up2{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(26px,-110px) scale(1.15);opacity:0}}

#start{position:fixed;left:0;top:0;right:0;bottom:0;background:#fff3d6;z-index:10;text-align:center;
  -webkit-transition:opacity .35s;transition:opacity .35s;}
#start.gone{opacity:0;}
#sTitle{position:absolute;left:0;right:0;top:10%;font-size:32px;font-weight:bold;letter-spacing:2px;}
#startBtn{position:absolute;left:50%;top:50%;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;
  background:#ff922b;color:#fff;box-shadow:inset 0 -10px 0 rgba(0,0,0,.15),0 7px 0 rgba(74,44,18,.15);}
#startBtn .big{font-size:96px;line-height:1;margin-top:40px;-webkit-animation:hop .9s ease-in-out infinite alternate;animation:hop .9s ease-in-out infinite alternate;}
#startBtn .go{font-size:21px;font-weight:bold;margin-top:12px;}
@-webkit-keyframes hop{from{-webkit-transform:translateY(0)}to{-webkit-transform:translateY(-10px)}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-10px)}}
#hint{position:absolute;left:20px;right:20px;bottom:5%;font-size:13px;line-height:1.75;opacity:.75;}
</style>
</head>
<body>
<div id="grid"></div>
<div id="fx"></div>
<div id="bar">
  <div id="title">がっき おとボタン</div>
  <div id="pills">
    <div class="pill" id="mode"><i class="fill"></i><span id="modeIcon">🎻</span> <span id="modeText">ほんもの</span><span class="hint">ながおし</span></div>
    <div class="pill off" id="stop"><span>■ とめる</span></div>
    <div class="pill" id="vol"><i class="fill"></i><span id="volIcon">🔉</span> <span id="volText">ふつう</span><span class="hint">ながおし</span></div>
  </div>
</div>
<div id="start">
  <div id="sTitle">がっき おとボタン</div>
  <div id="startBtn"><div class="big">🎵</div><div class="go">タップして はじめる</div></div>
  <div id="hint">がっきを おすと きょくが ながれるよ。もういちど おすと つぎの きょく。<br>音が出ないときは、消音（マナーモード）をオフにして音量を上げてください。右上の 🎻 を長押しで「ほんものの楽器の音」と「でんしおん」を切りかえ、🔉 を長押しで音の大きさを3段階で変えられます。</div>
</div>

<script src="data.js"></script>
<script>
(function () {
/* ===== 古いiPad(iOS 9〜)でも動くよう ES5 だけで書いています ===== */
var G = window.GAKKI;
function $(id) { return document.getElementById(id); }
var grid = $('grid'), fx = $('fx'), bar = $('bar'), titleEl = $('title'), stopEl = $('stop');

/* ---------- ボタンを作る ---------- */
var tiles = [];
for (var n = 0; n < G.length; n++) {
  var el = document.createElement('div');
  el.className = 'tile';
  el.setAttribute('data-i', n);
  el.style.backgroundColor = G[n].color;
  var img = document.createElement('img');
  img.className = 'art'; img.src = 'art/' + G[n].id + '.png'; img.alt = '';
  var lab = document.createElement('div');
  lab.className = 'lab';
  lab.innerHTML = '<span>' + G[n].name + '</span>';
  el.appendChild(img); el.appendChild(lab);
  grid.appendChild(el);
  tiles.push(el);
}

/* iPhone のノッチやホームバーをよける */
function safeArea() {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;' +
    'padding-top:constant(safe-area-inset-top);padding-right:constant(safe-area-inset-right);padding-bottom:constant(safe-area-inset-bottom);padding-left:constant(safe-area-inset-left);' +
    'padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);';
  document.body.appendChild(d);
  var cs = window.getComputedStyle(d);
  var r = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  document.body.removeChild(d);
  return r;
}

/* 画面の形に合わせて、いちばん見やすい並び（5×4、4×5、3×7 など）を選ぶ */
function layout() {
  var W = window.innerWidth, H = window.innerHeight, sa = safeArea();
  var headH = 46, pad = Math.round(Math.min(W, H) * 0.012) + 5;
  bar.style.left = (sa.l + pad + 4) + 'px'; bar.style.right = (sa.r + pad + 4) + 'px'; bar.style.top = Math.max(sa.t, 2) + 'px';
  var x0 = sa.l + pad, y0 = Math.max(sa.t, 2) + headH + 2;
  var gw = W - sa.l - sa.r - pad * 2, gh = H - y0 - Math.max(sa.b, 0) - pad;
  var C = [[5, 4], [4, 5], [3, 7], [7, 3], [2, 10], [10, 2]], best = null, bs = 1e9;
  for (var k = 0; k < C.length; k++) {
    var cols = C[k][0], rows = C[k][1];
    var gap = Math.max(6, Math.min(gw / cols, gh / rows) * 0.06);
    var cw = (gw - gap * (cols - 1)) / cols, ch = (gh - gap * (rows - 1)) / rows;
    if (cw < 40 || ch < 40) continue;
    var score = Math.abs(Math.log((cw / ch) / 1.35)) + (cols * rows - G.length) * 0.04;
    if (score < bs) { bs = score; best = { cols: cols, rows: rows, gap: gap, cw: cw, ch: ch }; }
  }
  var L = best;
  for (var i = 0; i < tiles.length; i++) {
    var el = tiles[i], r = Math.floor(i / L.cols), c = i % L.cols;
    el.style.left = (x0 + c * (L.cw + L.gap)) + 'px';
    el.style.top = (y0 + r * (L.ch + L.gap)) + 'px';
    el.style.width = L.cw + 'px'; el.style.height = L.ch + 'px';
    el.style.borderRadius = Math.round(Math.min(L.cw, L.ch) * 0.14) + 'px';
    var len = G[i].name.length + 1.3;
    var ls = Math.max(10, Math.min(Math.round(Math.min(L.cw * 0.11, L.ch * 0.13)), Math.floor(L.cw * 0.9 / len)));
    var labH = ls * 1.5;
    var art = el.firstChild, lab = el.lastChild;
    var areaW = L.cw * 0.84, areaH = L.ch - labH - L.ch * 0.16;
    var s = Math.min(areaW / G[i].w, areaH / G[i].h);
    var aw = G[i].w * s, ah = G[i].h * s;
    art.style.width = aw + 'px'; art.style.height = ah + 'px';
    art.style.left = ((L.cw - aw) / 2) + 'px';
    art.style.top = (L.ch * 0.07 + (areaH - ah) / 2) + 'px';
    lab.style.fontSize = ls + 'px';
    lab.style.bottom = Math.round(L.ch * 0.07) + 'px';
  }
  titleEl.style.right = ($('pills').offsetWidth + 10) + 'px';
}
layout();
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', function () { setTimeout(layout, 300); });

/* ---------- 音 ---------- */
var AC = window.AudioContext || window.webkitAudioContext;
var ctx = null, master = null, unlocked = false;
var OLD = !window.AudioContext;   /* 古いiPad：次の曲を先に用意しすぎない（メモリ節約） */
var VOLS = [0.35, 0.65, 1.0], VOL_ICON = ['🔈', '🔉', '🔊'], VOL_NAME = ['ちいさい', 'ふつう', 'おおきい'], volIdx = 1;
try { var sv = localStorage.getItem('gakki-oto-vol'); if (sv !== null && VOLS[+sv] !== undefined) volIdx = +sv; } catch (e) {}

function setupGraph(c) {
  var comp = c.createDynamicsCompressor();
  try { comp.threshold.value = -12; comp.knee.value = 8; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.25; } catch (e) {}
  var m = c.createGain(); m.gain.value = VOLS[volIdx];
  m.connect(comp); comp.connect(c.destination);
  return m;
}
function resume() {
  if (ctx && ctx.state && ctx.state !== 'running' && ctx.resume) {
    try { var p = ctx.resume(); if (p && p['catch']) p['catch'](function () {}); } catch (e) {}
  }
}
function unlock() {
  if (!AC) return;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e0) {}
  if (!ctx) { try { ctx = new AC(); } catch (e) { return; } master = setupGraph(ctx); }
  resume();
  if (!unlocked) {
    try { var b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0); } catch (e2) {}
    unlocked = true;
  }
}

/* 'real' = ほんものの楽器の音（録音した楽器で演奏） / 'synth' = でんしおん */
var mode = 'real';
try { if (localStorage.getItem('gakki-oto-mode') === 'synth') mode = 'synth'; } catch (e) {}
function dirOf(m) { return m === 'real' ? 'songs_real/' : 'songs/'; }

/* 曲のファイルを読む → 音のデータにする（いま鳴らす曲と、次の曲だけ持つ）
   読めなかったときは、もう一方のモードの同じ曲を使う（古いiPadのオフライン保存はほんもののみ） */
var cache = {};   /* "mode:name" -> AudioBuffer */
function load(name, cb, m, tried) {
  m = m || mode;
  var key = m + ':' + name;
  if (cache[key]) { cb(cache[key]); return; }
  var x = new XMLHttpRequest();
  function fail() {
    if (!tried) load(name, cb, m === 'real' ? 'synth' : 'real', true); else cb(null);
  }
  x.open('GET', dirOf(m) + name + '.m4a', true);
  x.responseType = 'arraybuffer';
  x.onload = function () {
    if (!((x.status === 200 || x.status === 0) && x.response && x.response.byteLength) || !ctx) { fail(); return; }
    var called = false;
    function done(b) { if (called) return; called = true; if (b) { cache[key] = b; cb(b); } else fail(); }
    try {
      var p = ctx.decodeAudioData(x.response, function (b) { done(b); }, function () { done(null); });
      if (p && p['catch']) p['catch'](function () { done(null); });
    } catch (e) { done(null); }
  };
  x.onerror = fail;
  x.send();
}
function keepOnly(names) {
  var keep = [];
  for (var i = 0; i < names.length; i++) { keep.push('real:' + names[i]); keep.push('synth:' + names[i]); }
  for (var k in cache) if (cache.hasOwnProperty(k) && keep.indexOf(k) < 0) delete cache[k];
}

/* いま鳴っているもの */
var cur = { inst: -1, queue: [], pos: 0, src: null, gain: null, token: 0, ending: null };

function shuffle(n, avoid) {
  var a = []; for (var i = 0; i < n; i++) a.push(i);
  for (var j = n - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)); var t = a[j]; a[j] = a[k]; a[k] = t; }
  if (avoid !== undefined && a[0] === avoid && n > 1) { var t2 = a[0]; a[0] = a[1]; a[1] = t2; }
  return a;
}
function fadeOut(src, gain) {
  if (!src) return;
  var now = ctx.currentTime;
  try { gain.gain.cancelScheduledValues(now); gain.gain.setValueAtTime(gain.gain.value, now); gain.gain.linearRampToValueAtTime(0, now + 0.3); } catch (e) {}
  try { src.stop(now + 0.35); } catch (e2) {}
  setTimeout(function () { try { gain.disconnect(); } catch (e3) {} }, 500);
}
function songName(i, k) { return G[i].songs[k].f; }

/* がっきを押した */
function pressInst(i) {
  if (!ctx) return;
  resume();
  if (cur.inst === i && cur.queue.length) {
    /* 同じがっき → 次の曲 */
    cur.pos = (cur.pos + 1) % cur.queue.length;
    if (cur.pos === 0) cur.queue = shuffle(G[i].songs.length, cur.queue[cur.queue.length - 1]);
  } else {
    cur.inst = i;
    cur.queue = shuffle(G[i].songs.length);
    cur.pos = 0;
  }
  startCurrent();
}
function startCurrent() {
  var i = cur.inst, k = cur.queue[cur.pos], name = songName(i, k), token = ++cur.token;
  fadeOut(cur.src, cur.gain); cur.src = null; cur.gain = null;
  clearTimeout(cur.ending);
  showPlaying(i, G[i].songs[k].t);
  load(name, function (buf) {
    if (token !== cur.token) return;
    if (!buf) { stopAll(); return; }
    var s = ctx.createBufferSource(), g = ctx.createGain();
    s.buffer = buf; s.connect(g); g.connect(master);
    var t = ctx.currentTime + 0.03;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + 0.04);
    s.start(t);
    cur.src = s; cur.gain = g;
    /* 終わったら、同じがっきの次の曲（5曲ぜんぶ鳴らしたら止まる） */
    var played = cur.pos;
    cur.ending = setTimeout(function () {
      if (token !== cur.token) return;
      if (played + 1 < cur.queue.length) { cur.pos = played + 1; startCurrent(); }
      else stopAll();
    }, (buf.duration + 0.4) * 1000);
    /* 次の曲を用意しておく */
    var nextName = (played + 1 < cur.queue.length) ? songName(i, cur.queue[played + 1]) : null;
    keepOnly(nextName && !OLD ? [name, nextName] : [name]);
    if (nextName && !OLD) setTimeout(function () { if (token === cur.token) load(nextName, function () {}); }, 1500);
  });
}
function stopAll() {
  cur.token++;
  clearTimeout(cur.ending);
  if (cur.src) fadeOut(cur.src, cur.gain);
  cur.src = null; cur.gain = null; cur.inst = -1; cur.queue = [];
  keepOnly([]);
  showPlaying(-1);
}

/* ---------- 見た目 ---------- */
var playingTile = -1, noteTimer = null;
var SYM = ['♪', '♫', '♪', '♬'], NCOL = ['#ff6b6b', '#4dabf7', '#fcc419', '#51cf66', '#9775fa', '#f06595', '#ff922b'];
function showPlaying(i, title) {
  for (var k = 0; k < tiles.length; k++) {
    var want = (k === i) ? 'tile playing' : 'tile';
    if (tiles[k].className.replace(' down', '') !== want) tiles[k].className = want;
  }
  playingTile = i;
  titleEl.textContent = i >= 0 ? ('♪ ' + G[i].name + '「' + title + '」') : 'がっき おとボタン';
  stopEl.className = i >= 0 ? 'pill' : 'pill off';
  clearInterval(noteTimer);
  if (i >= 0) { spawnNote(); noteTimer = setInterval(spawnNote, 520); }
}
/* 再生中は、がっきから音符がふわふわ出る */
function spawnNote() {
  if (playingTile < 0 || fx.childNodes.length > 24) return;
  var r = tiles[playingTile].getBoundingClientRect();
  var d = document.createElement('div');
  d.className = 'note ' + (Math.random() < 0.5 ? 'n1' : 'n2');
  d.textContent = SYM[Math.floor(Math.random() * SYM.length)];
  d.style.color = NCOL[Math.floor(Math.random() * NCOL.length)];
  d.style.fontSize = Math.round(Math.max(20, Math.min(34, r.height * 0.2))) + 'px';
  d.style.left = (r.left + r.width * (0.2 + Math.random() * 0.6)) + 'px';
  d.style.top = (r.top + r.height * 0.25) + 'px';
  fx.appendChild(d);
  setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 2000);
}
function pressLook(i) {
  var el = tiles[i];
  el.className = el.className.replace(' down', '') + ' down';
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.className = el.className.replace(' down', ''); }, 160);
}

/* ---------- 音の大きさ・とめる ---------- */
function showVol() {
  $('volIcon').textContent = VOL_ICON[volIdx]; $('volText').textContent = VOL_NAME[volIdx];
  if (master) master.gain.value = VOLS[volIdx];
}
function showMode() {
  $('modeIcon').textContent = mode === 'real' ? '🎻' : '🎹';
  $('modeText').textContent = mode === 'real' ? 'ほんもの' : 'でんしおん';
}
var HOLD = {
  vol: function () {
    volIdx = (volIdx + 1) % VOLS.length; showVol();
    try { localStorage.setItem('gakki-oto-vol', String(volIdx)); } catch (e) {}
  },
  mode: function () {
    mode = mode === 'real' ? 'synth' : 'real'; showMode();
    try { localStorage.setItem('gakki-oto-mode', mode); } catch (e) {}
    if (cur.inst >= 0 && cur.queue.length) startCurrent();   /* 鳴っている曲を、新しいモードで最初から */
  }
};
var holdTimer = null, holdEl = null;
function holdPress(el) {
  holdRelease();
  holdEl = el; el.className = 'pill holding';
  holdTimer = setTimeout(function () {
    holdTimer = null; holdRelease();
    HOLD[el.id]();
  }, 900);
}
function holdRelease() {
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  if (holdEl) { holdEl.className = 'pill'; holdEl = null; }
}
showVol();
showMode();

var started = false;
function start() {
  if (started) return;
  started = true;
  var st = $('start'); st.className = 'gone';
  setTimeout(function () { st.style.display = 'none'; }, 400);
}
if (!AC) $('startBtn').lastChild.textContent = 'このブラウザでは音が出せません';

/* ---------- タッチ ---------- */
var passiveOK = false;
try {
  var po = Object.defineProperty({}, 'passive', { get: function () { passiveOK = true; return true; } });
  window.addEventListener('ptest', null, po); window.removeEventListener('ptest', null, po);
} catch (e) {}
var NP = passiveOK ? { passive: false } : false, lastTouch = 0;
